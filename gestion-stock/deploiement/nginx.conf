# ============================================================
# NGINX (conteneur web) — sert le site compilé et relaie /api
#
# TLS : assuré par le proxy de l'hôte placé devant ce conteneur.
# Il doit envoyer X-Forwarded-Proto: https pour que l'API sache que la
# requête d'origine était chiffrée (sinon FORCER_HTTPS redirige en boucle).
# ============================================================

# Protocole vu par le client : celui annoncé par le proxy de l'hôte
# s'il termine le TLS, sinon celui de cette requête.
map $http_x_forwarded_proto $protocole_client {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain;

    # Fichiers compilés : noms hachés, donc cache long sans risque
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # proxy_pass sans chemin final : /api/... est transmis tel quel
    location /api/ {
        proxy_pass http://api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $protocole_client;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA : /confidentialite et /conditions-generales renvoient index.html
    location / {
        try_files $uri /index.html;
    }
}
